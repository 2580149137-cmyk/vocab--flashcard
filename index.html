<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>英语单词</title>
    <style>
        /* ===== 全局 ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            font-family: -apple-system, "PingFang SC", "Helvetica Neue", system-ui, sans-serif;
            background: #e8e8e8;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 8px;
            transition: background 0.3s;
        }
        .app-container {
            width: 100%;
            max-width: 420px;
            background: #ffffff;
            border-radius: 24px;
            padding: 14px 12px 16px;
            position: relative;
            transition: background 0.3s, box-shadow 0.3s;
            min-height: 94vh;
            display: flex;
            flex-direction: column;
            border: 1px solid rgba(0, 0, 0, 0.03);
            box-shadow: 0 8px 28px rgba(0, 0, 0, 0.04);
        }

        /* ===== 水印「笃」= 卡片下方，上边缘被卡片压住一点点 ===== */
        .watermark {
            position: absolute;
            bottom: 40px;
            left: 8px;
            font-family: "Songti SC", "SimSun", "宋体", serif !important;
            font-size: 110px;
            font-weight: 900;
            color: #888;
            opacity: 0.08;
            pointer-events: none;
            user-select: none;
            z-index: 0;
            line-height: 1;
            letter-spacing: -4px;
            transform: rotate(1deg);
            text-shadow: 0 4px 20px rgba(0, 0, 0, 0.04);
            transition: color 0.3s, opacity 0.3s;
            -webkit-font-smoothing: antialiased;
        }

        /* ===== 标题栏 ===== */
        .header {
            display: flex;
            align-items: center;
            gap: 4px;
            padding-bottom: 4px;
            position: relative;
            z-index: 10;
            background: inherit;
            flex-wrap: wrap;
            border-bottom: 1px solid #e8e8e8;
        }
        .header .title {
            font-size: 17px;
            font-weight: 700;
            color: #000;
            letter-spacing: 0.5px;
            white-space: nowrap;
        }
        .header .right-group {
            display: flex;
            align-items: center;
            gap: 3px;
            margin-left: auto;
            flex-wrap: wrap;
        }
        .header .progress-block {
            display: flex;
            align-items: center;
            gap: 3px;
            min-width: 44px;
            max-width: 100px;
        }
        .header .progress-track {
            flex: 1;
            height: 14px;
            background: #e8e8e8;
            border-radius: 4px;
            overflow: hidden;
            min-width: 24px;
        }
        .header .progress-track .fill {
            height: 100%;
            width: 0%;
            background: #000;
            border-radius: 4px;
            transition: width 0.3s;
        }
        .header .progress-pct {
            font-size: 9px;
            color: #888;
            font-weight: 600;
            min-width: 22px;
            text-align: right;
            font-variant-numeric: tabular-nums;
        }
        .header .header-stats {
            display: flex;
            align-items: center;
            gap: 3px;
            font-size: 9px;
            color: #888;
            white-space: nowrap;
            font-weight: 500;
        }
        .header .header-stats .num {
            font-weight: 700;
            color: #000;
        }
        .header .header-stats .sep {
            color: #ccc;
        }
        .header .search-btn {
            background: none;
            border: none;
            font-size: 15px;
            color: #000;
            cursor: pointer;
            padding: 2px 2px;
            line-height: 1;
            transition: opacity 0.2s;
            flex-shrink: 0;
            font-weight: 600;
        }
        .header .search-btn:active {
            opacity: 0.4;
        }
        .header .btn-dark-toggle {
            background: none;
            border: none;
            font-size: 17px;
            cursor: pointer;
            padding: 2px 2px;
            color: #000 !important;
            transition: opacity 0.3s;
            line-height: 1;
            filter: none !important;
            -webkit-filter: none !important;
            font-weight: 400;
            flex-shrink: 0;
        }
        .header .btn-dark-toggle:active {
            opacity: 0.4;
        }

        /* ===== 搜索框 ===== */
        .search-box {
            display: none;
            margin: 4px 0 6px 0;
            position: relative;
            z-index: 10;
        }
        .search-box.open {
            display: block;
        }
        .search-box input {
            width: 100%;
            padding: 6px 12px;
            border-radius: 30px;
            border: 1px solid #ddd;
            background: #f5f5f5;
            font-size: 12px;
            color: #000;
            outline: none;
            transition: border-color 0.2s, background 0.2s;
        }
        .search-box input::placeholder {
            color: #aaa;
        }
        .search-box input:focus {
            border-color: #888;
            background: #fff;
        }
        .search-box .hint {
            font-size: 11px;
            color: #aaa;
            margin-top: 2px;
            padding-left: 6px;
            display: none;
        }
        .search-box .hint.show {
            display: block;
        }

        /* ===== Tab切换栏 ===== */
        .tab-bar {
            display: flex;
            gap: 0px;
            margin: 4px 0 8px 0;
            position: relative;
            z-index: 10;
            border-bottom: 1px solid #e8e8e8;
            padding-bottom: 4px;
        }
        .tab-bar .tab {
            background: none;
            border: none;
            font-size: 12px;
            font-weight: 400;
            color: #999;
            cursor: pointer;
            padding: 4px 2px;
            transition: color 0.2s, border-color 0.2s;
            letter-spacing: 0.3px;
            border-bottom: 2px solid transparent;
            flex: 1;
            text-align: center;
        }
        .tab-bar .tab.active {
            color: #000;
            font-weight: 600;
            border-bottom-color: #000;
        }
        .tab-bar .tab:active {
            opacity: 0.5;
        }

        /* ===== 卡片（竖版长方形） ===== */
        .card-wrapper {
            flex: 1;
            margin: 2px 0 6px;
            min-height: 340px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            z-index: 1;
            cursor: default;
        }
        .card {
            width: 100%;
            min-height: 320px;
            background: #ffffff;
            border-radius: 20px;
            padding: 20px 14px;
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: center;
            border: 1px solid #f0f0f0;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.04);
            cursor: default;
            user-select: none;
            transition: box-shadow 0.3s;
            z-index: 2;
        }
        .card-front,
        .card-back {
            transition: opacity 0.3s ease;
            width: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            pointer-events: none;
        }
        .card-back {
            position: absolute;
            top: 0;
            left: 0;
            padding: 20px 14px;
            height: 100%;
            border-radius: 20px;
            background: #fff;
            border: 1px solid #f0f0f0;
            opacity: 0;
            pointer-events: none;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.04);
        }
        .card.flipped .card-front {
            opacity: 0;
            pointer-events: none;
        }
        .card.flipped .card-back {
            opacity: 1;
            pointer-events: auto;
        }

        /* 正面：纵向列表 */
        .card-front .word-list {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            font-size: 20px;
            font-weight: 700;
            color: #000;
            line-height: 1.5;
            letter-spacing: 0.5px;
            text-align: center;
            padding: 8px 0;
        }
        .card-front .word-list span {
            display: block;
            padding: 2px 0;
        }
        .card-front .hint {
            margin-top: 16px;
            font-size: 11px;
            color: #bbb;
            text-align: center;
            letter-spacing: 1.5px;
            font-weight: 400;
        }

        /* ===== 卡片背面 ===== */
        .card-back .meanings {
            font-size: 14px;
            line-height: 1.7;
            color: #000;
        }
        .card-back .meanings .item {
            display: flex;
            align-items: baseline;
            flex-wrap: wrap;
            margin-bottom: 4px;
            padding-bottom: 4px;
            border-bottom: 1px solid #f0f0f0;
        }
        .card-back .meanings .item:last-child {
            border-bottom: none;
        }
        .card-back .meanings .word {
            font-weight: 700;
            margin-right: 4px;
            color: #000;
        }
        .card-back .meanings .phonetic {
            font-size: 12px;
            color: #999;
            font-weight: 400;
            margin-right: 4px;
        }
        .card-back .meanings .def {
            font-size: 13px;
            color: #444;
            font-weight: 400;
            flex: 1;
        }
        .card-back .meanings .signal {
            display: inline-flex;
            align-items: flex-end;
            gap: 1.5px;
            margin-left: 4px;
            height: 18px;
            flex-shrink: 0;
        }
        .card-back .meanings .signal .bar {
            width: 4px;
            border-radius: 1px;
            background: #d0d0d0;
            transition: background 0.2s, height 0.2s;
        }
        .card-back .meanings .signal .bar.filled {
            background: #000;
        }
        .card-back .analysis {
            margin-top: 10px;
            padding: 10px 12px;
            background: #f7f7f7;
            border-radius: 12px;
            border-left: 3px solid #888;
            font-size: 12px;
            color: #222;
            line-height: 1.6;
            box-shadow: inset 0 1px 4px rgba(0, 0, 0, 0.02);
        }
        .card-back .analysis strong {
            font-weight: 700;
            color: #000;
        }

        /* ===== 评价按钮 ===== */
        .card-actions {
            display: flex;
            justify-content: center;
            gap: 24px;
            margin-top: 12px;
            padding-top: 10px;
            border-top: 1px solid #e8e8e8;
            pointer-events: auto;
        }
        .card-actions button {
            background: none;
            border: none;
            font-size: 20px;
            color: #666;
            cursor: pointer;
            padding: 4px 8px;
            min-height: 36px;
            min-width: 36px;
            transition: transform 0.1s, color 0.2s, background 0.2s;
            pointer-events: auto;
            border-radius: 30px;
            background: #f0f0f0;
            font-weight: 400;
        }
        .card-actions button:active {
            transform: scale(0.88);
            background: #ddd;
        }
        .card-actions .btn-star.active {
            color: #000;
            background: #ddd;
        }

        /* ===== 底部 ===== */
        .footer-actions {
            display: flex;
            justify-content: flex-end;
            align-items: center;
            margin-top: 4px;
            padding-top: 6px;
            position: relative;
            z-index: 10;
            background: inherit;
            border-top: 1px solid #e8e8e8;
            min-height: 28px;
        }
        .footer-actions .right-group {
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .footer-actions .right-group .btn-icon {
            background: none;
            border: none;
            font-size: 13px;
            color: #000;
            cursor: pointer;
            padding: 2px 2px;
            transition: opacity 0.2s;
            line-height: 1;
            display: flex;
            align-items: center;
            gap: 2px;
            font-weight: 600;
        }
        .footer-actions .right-group .btn-icon:active {
            opacity: 0.4;
        }
        .footer-actions .right-group .btn-icon .badge {
            font-size: 11px;
            font-weight: 600;
            color: #888;
        }
        .footer-actions .right-group .btn-icon.active-filter {
            opacity: 0.5;
        }
        .footer-actions .right-group .btn-death {
            background: none;
            border: none;
            font-size: 13px;
            color: #000;
            cursor: pointer;
            padding: 2px 2px;
            transition: opacity 0.2s;
            line-height: 1;
            font-weight: 600;
            letter-spacing: 0.5px;
        }
        .footer-actions .right-group .btn-death:active {
            opacity: 0.4;
        }

        .footer-saying {
            text-align: left;
            margin-top: 2px;
            font-size: 9px;
            font-family: "Songti SC", "SimSun", "宋体", serif !important;
            color: #bbb;
            letter-spacing: 3px;
            opacity: 0.5;
            user-select: none;
            transition: color 0.3s, opacity 0.3s;
            position: relative;
            z-index: 10;
            -webkit-font-smoothing: antialiased;
        }

        /* 返回全部 */
        .back-all {
            display: none;
            font-size: 10px;
            color: #888;
            cursor: pointer;
            background: none;
            border: none;
            padding: 2px 6px;
            border-radius: 14px;
            background: #f0f0f0;
            transition: background 0.2s;
            margin-left: 4px;
        }
        .back-all:active {
            background: #ddd;
        }
        .back-all.show {
            display: inline-block;
        }

        /* ===== 快捷键弹窗 ===== */
        .shortcut-toast {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0.92);
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            color: #fff;
            padding: 12px 16px;
            border-radius: 14px;
            font-size: 12px;
            letter-spacing: 1px;
            line-height: 1.8;
            text-align: center;
            z-index: 999;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.4s ease, transform 0.4s ease;
            box-shadow: 0 12px 48px rgba(0, 0, 0, 0.25);
            max-width: 260px;
        }
        .shortcut-toast.show {
            opacity: 1;
            pointer-events: none;
            transform: translate(-50%, -50%) scale(1);
        }
        .shortcut-toast .key {
            display: inline-block;
            background: rgba(255, 255, 255, 0.12);
            padding: 0 8px;
            border-radius: 4px;
            margin: 0 2px;
            font-weight: 500;
            font-size: 11px;
        }

        /* ============================================================
                   暗色模式
                   ============================================================ */
        body.dark-mode {
            background: #1a1a1a;
        }
        body.dark-mode .app-container {
            background: #1a1a1a;
            border-color: #2a2a2a;
            box-shadow: none;
        }
        body.dark-mode .header {
            border-bottom-color: #2a2a2a;
        }
        body.dark-mode .header .title {
            color: #fff;
        }
        body.dark-mode .header .progress-track {
            background: #2a2a2a;
        }
        body.dark-mode .header .progress-track .fill {
            background: #fff;
        }
        body.dark-mode .header .progress-pct {
            color: #888;
        }
        body.dark-mode .header .header-stats {
            color: #888;
        }
        body.dark-mode .header .header-stats .num {
            color: #fff;
        }
        body.dark-mode .header .header-stats .sep {
            color: #444;
        }
        body.dark-mode .header .search-btn {
            color: #fff;
        }
        body.dark-mode .header .btn-dark-toggle {
            color: #fff !important;
        }
        body.dark-mode .tab-bar {
            border-bottom-color: #2a2a2a;
        }
        body.dark-mode .tab-bar .tab {
            color: #777;
        }
        body.dark-mode .tab-bar .tab.active {
            color: #fff;
            border-bottom-color: #fff;
        }
        body.dark-mode .search-box input {
            background: #2a2a2a;
            border-color: #3a3a3a;
            color: #fff;
        }
        body.dark-mode .search-box input::placeholder {
            color: #666;
        }
        body.dark-mode .search-box input:focus {
            border-color: #666;
            background: #222;
        }
        body.dark-mode .card {
            background: #1e1e1e;
            border-color: #2a2a2a;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
        }
        body.dark-mode .card-back {
            background: #1e1e1e;
            border-color: #2a2a2a;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
        }
        body.dark-mode .card-front .word-list {
            color: #fff;
        }
        body.dark-mode .card-front .hint {
            color: #666;
        }
        body.dark-mode .card-back .meanings {
            color: #fff;
        }
        body.dark-mode .card-back .meanings .word {
            color: #fff;
        }
        body.dark-mode .card-back .meanings .phonetic {
            color: #888;
        }
        body.dark-mode .card-back .meanings .def {
            color: #bbb;
        }
        body.dark-mode .card-back .meanings .item {
            border-bottom-color: #2a2a2a;
        }
        body.dark-mode .card-back .meanings .signal .bar {
            background: #444;
        }
        body.dark-mode .card-back .meanings .signal .bar.filled {
            background: #fff;
        }
        body.dark-mode .card-back .analysis {
            background: #1a1a1a;
            color: #ccc;
            border-left-color: #666;
            box-shadow: inset 0 1px 4px rgba(0, 0, 0, 0.3);
        }
        body.dark-mode .card-back .analysis strong {
            color: #fff;
        }
        body.dark-mode .card-actions {
            border-top-color: #2a2a2a;
        }
        body.dark-mode .card-actions button {
            background: #2a2a2a;
            color: #aaa;
        }
        body.dark-mode .card-actions button:active {
            background: #3a3a3a;
        }
        body.dark-mode .card-actions .btn-star.active {
            background: #555;
            color: #fff;
        }
        body.dark-mode .footer-actions {
            border-top-color: #2a2a2a;
        }
        body.dark-mode .footer-actions .right-group .btn-icon {
            color: #fff;
        }
        body.dark-mode .footer-actions .right-group .btn-icon .badge {
            color: #999;
        }
        body.dark-mode .footer-actions .right-group .btn-death {
            color: #fff;
        }
        body.dark-mode .footer-saying {
            color: #555;
            opacity: 0.4;
        }
        body.dark-mode .watermark {
            color: #ffffff;
            opacity: 0.04;
        }
        body.dark-mode .shortcut-toast {
            background: rgba(220, 220, 220, 0.92);
            color: #222;
        }
        body.dark-mode .shortcut-toast .key {
            background: rgba(0, 0, 0, 0.08);
        }
        body.dark-mode .back-all {
            color: #999;
            background: #2a2a2a;
        }
        body.dark-mode .back-all:active {
            background: #3a3a3a;
        }

        /* ============================================================
                   响应式（手机优先）
                   ============================================================ */
        @media (max-width: 768px) {
            body {
                padding: 6px;
                align-items: flex-start;
                padding-top: 8px;
            }
            .app-container {
                border-radius: 20px;
                padding: 10px 8px 14px;
                min-height: 94vh;
                box-shadow: none;
                border: 1px solid rgba(0, 0, 0, 0.04);
                max-width: 400px;
            }
            .watermark {
                font-size: 100px;
                bottom: 32px;
                left: 4px;
                opacity: 0.07;
            }
            .header .title {
                font-size: 15px;
            }
            .header .progress-track {
                height: 12px;
                min-width: 20px;
            }
            .header .progress-pct {
                font-size: 8px;
                min-width: 18px;
            }
            .header .header-stats {
                font-size: 8px;
                gap: 2px;
            }
            .header .search-btn {
                font-size: 13px;
            }
            .header .btn-dark-toggle {
                font-size: 15px;
            }
            .tab-bar .tab {
                font-size: 11px;
            }
            .card-wrapper {
                min-height: 280px;
                margin: 2px 0 4px;
            }
            .card {
                min-height: 260px;
                padding: 16px 12px;
                border-radius: 18px;
            }
            .card-back {
                padding: 16px 12px;
                border-radius: 18px;
            }
            .card-front .word-list {
                font-size: 18px;
                gap: 4px;
            }
            .card-front .hint {
                font-size: 10px;
                margin-top: 12px;
            }
            .card-back .meanings {
                font-size: 13px;
                line-height: 1.6;
            }
            .card-back .meanings .def {
                font-size: 12px;
            }
            .card-back .meanings .phonetic {
                font-size: 11px;
            }
            .card-back .meanings .signal {
                height: 16px;
                gap: 1px;
            }
            .card-back .meanings .signal .bar {
                width: 3.5px;
            }
            .card-back .analysis {
                font-size: 11px;
                padding: 8px 10px;
                margin-top: 8px;
            }
            .card-actions {
                gap: 16px;
                margin-top: 10px;
                padding-top: 8px;
            }
            .card-actions button {
                font-size: 18px;
                padding: 4px 6px;
                min-height: 32px;
                min-width: 32px;
            }
            .footer-actions {
                margin-top: 2px;
                padding-top: 4px;
                min-height: 24px;
            }
            .footer-actions .right-group {
                gap: 4px;
            }
            .footer-actions .right-group .btn-icon {
                font-size: 12px;
            }
            .footer-actions .right-group .btn-icon .badge {
                font-size: 10px;
            }
            .footer-actions .right-group .btn-death {
                font-size: 12px;
            }
            .footer-saying {
                font-size: 8px;
                margin-top: 2px;
                letter-spacing: 2px;
            }
            .shortcut-toast {
                font-size: 11px;
                padding: 10px 14px;
                max-width: 220px;
            }
            .shortcut-toast .key {
                font-size: 10px;
            }
            .back-all {
                font-size: 9px;
                padding: 2px 4px;
            }
        }

        @media (max-width: 400px) {
            .app-container {
                max-width: 360px;
                padding: 8px 6px 12px;
                min-height: 92vh;
            }
            .watermark {
                font-size: 80px;
                bottom: 28px;
                left: 2px;
            }
            .header .title {
                font-size: 14px;
            }
            .header .progress-block {
                max-width: 60px;

<body>

<div class="app-container" id="app">
    <!-- 水印「笃」 -->
    <div class="watermark">笃</div>

    <!-- 标题栏 -->
    <div class="header">
        <span class="title">英语单词</span>
        <div class="right-group">
            <div class="progress-block">
                <div class="progress-track"><div class="fill" id="progressFill" style="width:0%;"></div></div>
                <span class="progress-pct" id="progressPct">0%</span>
            </div>
            <div class="header-stats">
                <span>复习 <span class="num" id="reviewCountHeader">0</span></span>
                <span class="sep">|</span>
                <span id="countdownText">DAY105</span>
            </div>
            <button class="btn-dark-toggle" id="styleToggle">☯</button>
            <button class="search-btn" id="searchToggle">⌕</button>
        </div>
    </div>

    <!-- 搜索框 -->
    <div class="search-box" id="searchBox">
        <input type="text" id="searchInput" placeholder="搜索单词..." />
        <div class="hint" id="searchHint">未找到</div>

    <!-- Tab 切换 -->
    <div class="tab-bar" id="tabBar">
        <button class="tab active" data-tab="shape">形近词</button>
        <button class="tab" data-tab="synonym">近义词</button>
        <button class="tab" data-tab="root">词根词缀</button>
        <button class="tab" data-tab="polysemy">熟词僻义</button>
    </div>

    <!-- 卡片 -->
    <div class="card-wrapper">
        <div class="card" id="card">
            <div class="card-front" id="cardFront">
                <div class="word-list" id="wordList"></div>
                <div class="hint">双击翻转</div>
            </div>
            <div class="card-back" id="cardBack">
                <div id="backContent"></div>
                <div class="card-actions" id="cardActions">
                    <button class="btn-forgot" id="btnForgot">✕</button>
                    <button class="btn-remember" id="btnRemember">✓</button>
                    <button class="btn-star" id="btnStar">☆</button>

            </div>
        </div>
    </div>

    <!-- 底部 -->
    <div class="footer-actions">
        <div class="right-group">
            <button class="btn-icon" id="favFilterBtn">F <span class="badge" id="favCount">0</span></button>
            <button class="btn-icon" id="wrongFilterBtn">W <span class="badge" id="wrongCount">0</span></button>
            <button class="btn-icon" id="reviewBtn">↺</button>
            <button class="btn-death" id="deathModeBtn">⟡</button>
            <button class="back-all" id="backAllBtn">全部</button>
        </div>
    </div>
    <div class="footer-saying">事以密成 · 一鸣惊人</div>
</div>

<!-- 快捷键弹窗 -->
<div class="shortcut-toast" id="shortcutToast">
    <div><span class="key">←</span> 上一张 &nbsp;|&nbsp; <span class="key">双击</span> 翻转 &nbsp;|&nbsp; <span class="key">→</span> 下一张</div>
</div>

<script>
    // ============================================================
    // 数据区（四大板块，各80组）— 完整数据请见最终版
    // 此处仅保留各板块前5组作为示例，实际使用时补全
    // ============================================================

    // 形近词（80组）
    const SHAPE_DATA = [
        { group: ["principal", "principle"], meanings: ["主要的；校长", "原则；原理"], analysis: "末尾倒数第二字母 a vs e。" },
        { group: ["stationary", "stationery"], meanings: ["静止的；固定的", "文具；信纸"], analysis: "后缀 ary vs ery。" },
        { group: ["compliment", "complement"], meanings: ["赞美；恭维", "补充；互补"], analysis: "中间元音 i vs e。" },
        { group: ["access", "assess", "excess"], meanings: ["通道；接近", "评估；评定", "过量；额外的"], analysis: "首字母组合 ac/as/ex。" },
        { group: ["accept", "except", "expect"], meanings: ["接受；承认", "除…之外", "期望；预料"], analysis: "accept/ac，except/ex+cept，expect/ex+pect。" }
    ];
    // 完整80组数据请替换为你的完整数据

    // 近义词（80组）
    const SYNONYM_DATA = [
        { group: ["maintain", "assert", "claim", "allege"], meanings: ["维持；坚称", "断言；主张", "声称；要求", "（无证据地）断言"], analysis: "maintain 坚持维护；assert 自信断言；claim 要求承认；allege 缺乏证据。" },
        { group: ["affect", "influence", "impact"], meanings: ["影响（直接/负面）", "影响（潜移默化）", "冲击性影响"], analysis: "affect 可观察变化；influence 间接长期；impact 强烈冲击。" },
        { group: ["comply", "conform", "adhere"], meanings: ["遵守（要求）", "符合；遵守", "坚持；遵守"], analysis: "comply 服从指令；conform 符合规范；adhere 固守原则。" },
        { group: ["confine", "restrict", "restrain", "constrain"], meanings: ["限制（活动）", "限制（范围）", "抑制、约束", "强迫、约束"], analysis: "confine 不超出范围；restrict 保持在限度内；restrain 阻止冲动；constrain 外部强制。" },
        { group: ["ensure", "guarantee", "assure", "insure"], meanings: ["确保", "保证", "向…保证", "给…保险"], analysis: "ensure 保障结果；guarantee 正式承诺；assure 消除疑虑；insure 保险业务。" }
    ];

    // 词根词缀（80组）
    const ROOT_DATA = [
        { group: ["fer-"], meanings: ["携带、拿"], analysis: "例词：transfer（转移），infer（推断），prefer（更喜欢）。" },
        { group: ["spect-"], meanings: ["看"], analysis: "例词：inspect（检查），prospect（展望），retrospective（回顾的）。" },
        { group: ["dict-"], meanings: ["说"], analysis: "例词：predict（预言），dictate（口述），verdict（裁决）。" },
        { group: ["duct-"], meanings: ["引导"], analysis: "例词：conduct（引导），introduce（介绍），produce（生产）。" },
        { group: ["ject-"], meanings: ["投掷"], analysis: "例词：project（投射），reject（拒绝），inject（注射）。" }
    ];

    // 熟词僻义（80组）
    const POLYSEMY_DATA = [
        { group: ["address"], meanings: ["地址（常见）", "解决、处理；向……发表演讲（僻义）"], analysis: "搭配 address the problem/issue。" },
        { group: ["check"], meanings: ["检查（常见）", "控制、抑制（僻义）"], analysis: "搭配 keep/hold...in check，check the spread。" },
        { group: ["novel"], meanings: ["小说（常见）", "新颖的、新奇的（僻义）"], analysis: "搭配 novel approach/idea。" },
        { group: ["secure"], meanings: ["安全的（常见）", "获得、争取到；使牢固（僻义）"], analysis: "搭配 secure a job，secure efficiency。" },
        { group: ["weather"], meanings: ["天气（常见）", "经受住，平安度过（困境）（僻义）"], analysis: "搭配 weather the crisis/storm。" }
    ];


    // ============================================================
    // 核心逻辑
    // ============================================================

    const TAB_DATA = {
        shape: { name: '形近词', data: SHAPE_DATA, storagePrefix: 'shape' },
        synonym: { name: '近义词', data: SYNONYM_DATA, storagePrefix: 'syn' },
        root: { name: '词根词缀', data: ROOT_DATA, storagePrefix: 'root' },
        polysemy: { name: '熟词僻义', data: POLYSEMY_DATA, storagePrefix: 'poly' }
    };

    let currentTab = 'shape';
    let currentIndex = 0;
    let isFlipped = false;
    let learnedSet = new Set(); // 用于计算学习进度

    // 存储
    const STORE = {};
    for (const key of Object.keys(TAB_DATA)) {
        const p = TAB_DATA[key].storagePrefix;
        STORE[key] = {
            fav: new Set(JSON.parse(localStorage.getItem(p + '_fav_v10') || '[]')),
            wrong: new Set(JSON.parse(localStorage.getItem(p + '_wrong_v10') || '[]')),
            signal: JSON.parse(localStorage.getItem(p + '_signal_v10') || '{}')
        };
        // 恢复学习进度
        const savedLearned = JSON.parse(localStorage.getItem(p + '_learned_v10') || '[]');
        for (const idx of savedLearned) {
            learnedSet.add(key + '-' + idx);
        }
    }

    let currentFilter = 'all';
    let filteredIndices = [];

    const cardEl = document.getElementById('card');
    const wordListEl = document.getElementById('wordList');
    const backContentEl = document.getElementById('backContent');
    const progressFill = document.getElementById('progressFill');
    const progressPct = document.getElementById('progressPct');
    const favCountEl = document.getElementById('favCount');
    const wrongCountEl = document.getElementById('wrongCount');
    const reviewCountHeader = document.getElementById('reviewCountHeader');
    const countdownText = document.getElementById('countdownText');
    const btnStar = document.getElementById('btnStar');
    const backAllBtn = document.getElementById('backAllBtn');
    const tabBar = document.getElementById('tabBar');

    countdownText.textContent = 'DAY105';

    function getData() { return TAB_DATA[currentTab].data; }
    function getStore() { return STORE[currentTab]; }
    function getCurrentCard() { return getData()[currentIndex]; }
    function getStoragePrefix() { return TAB_DATA[currentTab].storagePrefix; }
    function getLearnedKey() { return getStoragePrefix() + '-' + currentIndex; }

    function getSignal(wordId, wordIdx) {
        const key = wordId + '-' + wordIdx;
        return getStore().signal[key] || 0;
    }
    function setSignal(wordId, wordIdx, val) {
        const key = wordId + '-' + wordIdx;
        if (val < 0) val = 0;
        if (val > 5) val = 5;
        getStore().signal[key] = val;
        localStorage.setItem(getStoragePrefix() + '_signal_v10', JSON.stringify(getStore().signal));
    }
    function changeSignal(wordId, wordIdx, delta) {
        const cur = getSignal(wordId, wordIdx);
        setSignal(wordId, wordIdx, cur + delta);
    }

    function getFilteredList() {
        const store = getStore();
        if (currentFilter === 'fav') return [...store.fav];
        if (currentFilter === 'wrong') return [...store.wrong];
        if (currentFilter === 'review') {
            const combined = new Set([...store.fav, ...store.wrong]);
            return [...combined];
        }
        return getData().map((_, i) => i);
    }

    function updateCounters() {
        const store = getStore();
        favCountEl.textContent = store.fav.size;
        wrongCountEl.textContent = store.wrong.size;
        const reviewSet = new Set([...store.fav, ...store.wrong]);
        reviewCountHeader.textContent = reviewSet.size;
        const p = getStoragePrefix();
        localStorage.setItem(p + '_fav_v10', JSON.stringify([...store.fav]));
        localStorage.setItem(p + '_wrong_v10', JSON.stringify([...store.wrong]));
    }

    // 学习进度：已学卡片数 / 总卡片数
    function updateProgress() {
        const total = getData().length;
        const p = getStoragePrefix();
        const learned = new Set(JSON.parse(localStorage.getItem(p + '_learned_v10') || '[]'));
        const pct = total > 0 ? Math.round((learned.size / total) * 100) : 0;
        progressFill.style.width = pct + '%';
        progressPct.textContent = pct + '%';
        return learned;
    }

    function markLearned() {
        const p = getStoragePrefix();
        const learned = new Set(JSON.parse(localStorage.getItem(p + '_learned_v10') || '[]'));
        learned.add(currentIndex);
        localStorage.setItem(p + '_learned_v10', JSON.stringify([...learned]));
        updateProgress();
    }

    function renderCard() {
        const card = getCurrentCard();
        const group = card.group || [];
        const meanings = card.meanings || [];
        const analysis = card.analysis || '';

        // 正面
        wordListEl.innerHTML = group.map(w => `<span>${w}</span>`).join('');

        // 背面
        let html = '<div class="meanings">';
        if (currentTab === 'root') {
            html += `<div class="item"><span class="word">${group[0] || ''}</span><span class="def">${meanings[0] || ''}</span></div>`;
        } else if (currentTab === 'polysemy') {
            if (meanings.length >= 2) {
                html += `<div class="item"><span class="word">${group[0] || ''}</span><span class="def">常见：${meanings[0]}</span></div>`;
                html += `<div class="item"><span class="def" style="font-weight:600;">僻义：${meanings[1]}</span></div>`;
            }
        } else {
            group.forEach((w, i) => {
                const def = meanings[i] || '';
                const signal = getSignal(currentIndex, i);
                let bars = '';
                for (let b = 0; b < 5; b++) {
                    bars += `<span class="bar ${b < signal ? 'filled' : ''}"></span>`;
                }
                html += `<div class="item">
                            <span class="word">${w}</span>
                            <span class="def">${def}</span>
                            <span class="signal">${bars}</span>
                         </div>`;
            });
        }
        html += '</div>';
        if (analysis) {
            html += `<div class="analysis"><strong>辨析：</strong>${analysis}</div>`;
        }
        backContentEl.innerHTML = html;

        // 进度
        updateProgress();
        updateStarButton();
        updateCounters();
        cardEl.classList.toggle('flipped', isFlipped);
    }

    function updateStarButton() {
        const store = getStore();
        if (store.fav.has(currentIndex)) {
            btnStar.textContent = '★';
            btnStar.classList.add('active');
        } else {
            btnStar.textContent = '☆';
            btnStar.classList.remove('active');
        }
    }

    // 导航
    function goTo(index) {
        const list = currentFilter === 'all' ? getData().map((_, i) => i) : filteredIndices;
        if (list.length === 0) { resetFilter(); return; }
        let pos = list.indexOf(index);
        if (pos === -1) pos = 0;
        if (index < 0) index = list[list.length - 1] || 0;
        if (index >= getData().length) index = list[0] || 0;
        currentIndex = index;
        isFlipped = false;
        renderCard();
    }

    function nextCard() {
        const list = currentFilter === 'all' ? getData().map((_, i) => i) : filteredIndices;
        if (list.length === 0) { resetFilter(); return; }
        let pos = list.indexOf(currentIndex);
        if (pos === -1) pos = 0;
        pos = (pos + 1) % list.length;
        currentIndex = list[pos];
        isFlipped = false;
        renderCard();
    }

    function prevCard() {
        const list = currentFilter === 'all' ? getData().map((_, i) => i) : filteredIndices;
        if (list.length === 0) { resetFilter(); return; }
        let pos = list.indexOf(currentIndex);
        if (pos === -1) pos = 0;
        pos = (pos - 1 + list.length) % list.length;
        currentIndex = list[pos];
        isFlipped = false;
        renderCard();
    }

    function toggleFlip() {
        isFlipped = !isFlipped;
        cardEl.classList.toggle('flipped', isFlipped);
        if (isFlipped) {
            markLearned();
            const store = getStore();
            store.fav.add(currentIndex);
            updateCounters();
            updateStarButton();
        }
    }

    // 筛选
    function applyFilter(filter) {
        currentFilter = filter;
        filteredIndices = getFilteredList();
        if (filteredIndices.length === 0) {
            alert('当前筛选下没有卡片。');
            resetFilter();
            return;
        }
        currentIndex = filteredIndices[0];
        isFlipped = false;
        renderCard();
        backAllBtn.classList.add('show');
        document.querySelectorAll('.btn-icon').forEach(btn => btn.classList.remove('active-filter'));
        if (filter === 'fav') document.getElementById('favFilterBtn').classList.add('active-filter');
        if (filter === 'wrong') document.getElementById('wrongFilterBtn').classList.add('active-filter');
        if (filter === 'review') document.getElementById('reviewBtn').classList.add('active-filter');
    }

    function resetFilter() {
        currentFilter = 'all';
        filteredIndices = getData().map((_, i) => i);
        currentIndex = filteredIndices[0] || 0;
        isFlipped = false;
        renderCard();
        backAllBtn.classList.remove('show');
        document.querySelectorAll('.btn-icon').forEach(btn => btn.classList.remove('active-filter'));
    }

    function switchTab(tabKey) {
        currentTab = tabKey;
        currentIndex = 0;
        isFlipped = false;
        currentFilter = 'all';
        filteredIndices = getData().map((_, i) => i);
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        document.querySelector(`.tab[data-tab="${tabKey}"]`).classList.add('active');
        renderCard();
        backAllBtn.classList.remove('show');
        document.querySelectorAll('.btn-icon').forEach(btn => btn.classList.remove('active-filter'));
    }

    // ===== 事件绑定 =====

    // 单击：左右翻页
    cardEl.addEventListener('click', function(e) {
        if (e.detail > 1) return; // 双击不触发翻页
        const rect = this.getBoundingClientRect();
        const x = e.clientX - rect.left;
        const width = rect.width;
        if (x < width * 0.3) { prevCard(); }
        else if (x > width * 0.7) { nextCard(); }
    });

    // 双击：翻转
    cardEl.addEventListener('dblclick', function(e) {
        e.preventDefault();
        toggleFlip();
    });

    // 评价按钮
    document.getElementById('btnForgot').addEventListener('click', function(e) {
        e.stopPropagation();
        const store = getStore();
        store.wrong.add(currentIndex);
        const card = getCurrentCard();
        if (card.group) {
            card.group.forEach((_, i) => changeSignal(currentIndex, i, -1));
        }
        updateCounters();
        renderCard();
        nextCard();
    });

    document.getElementById('btnRemember').addEventListener('click', function(e) {
        e.stopPropagation();
        const store = getStore();
        const card = getCurrentCard();
        if (card.group) {
            card.group.forEach((_, i) => changeSignal(currentIndex, i, 1));
        }
        if (store.wrong.has(currentIndex)) {
            store.wrong.delete(currentIndex);
            updateCounters();
        }
        renderCard();
        nextCard();
    });

    btnStar.addEventListener('click', function(e) {
        e.stopPropagation();
        const store = getStore();
        if (store.fav.has(currentIndex)) {
            store.fav.delete(currentIndex);
        } else {
            store.fav.add(currentIndex);
        }
        updateCounters();
        updateStarButton();
        renderCard();
    });

    // 底部功能按钮
    document.getElementById('favFilterBtn').addEventListener('click', function() {
        if (currentFilter === 'fav') resetFilter();
        else applyFilter('fav');
    });
    document.getElementById('wrongFilterBtn').addEventListener('click', function() {
        if (currentFilter === 'wrong') resetFilter();
        else applyFilter('wrong');
    });
    document.getElementById('reviewBtn').addEventListener('click', function() {
        if (currentFilter === 'review') resetFilter();
        else applyFilter('review');
    });
    backAllBtn.addEventListener('click', resetFilter);

    // 明暗切换（太极锁定颜色）
    document.getElementById('styleToggle').addEventListener('click', function() {
        document.body.classList.toggle('dark-mode');
        this.style.color = document.body.classList.contains('dark-mode') ? '#fff !important' : '#000 !important';
    });

    // 死亡模式
    document.getElementById('deathModeBtn').addEventListener('click', function() {
        alert('「考前30天死亡模式」将在二期开放。');
    });

    // 搜索
    document.getElementById('searchToggle').addEventListener('click', function() {
        const box = document.getElementById('searchBox');
        box.classList.toggle('open');
        if (box.classList.contains('open')) {
            document.getElementById('searchInput').focus();
        }
    });
    document.getElementById('searchInput').addEventListener('input', function() {
        const hint = document.getElementById('searchHint');
        const q = this.value.toLowerCase();
        if (q.length > 0) {
            const data = getData();
            const found = data.some(card => {
                const g = card.group || [];
                return g.some(w => w.toLowerCase().includes(q));
            });
            hint.classList.toggle('show', !found);
        } else {
            hint.classList.remove('show');
        }
    });

    // Tab 点击
    document.querySelectorAll('.tab').forEach(tab => {
        tab.addEventListener('click', function() {
            switchTab(this.dataset.tab);
        });
    });

    // 键盘快捷键
    document.addEventListener('keydown', function(e) {
        if (e.key === 'ArrowLeft') { e.preventDefault();
            prevCard(); }
        if (e.key === 'ArrowRight') { e.preventDefault();
            nextCard(); }
        if (e.key === ' ' || e.key === 'Space') {
            e.preventDefault();
            toggleFlip();
        }
    });

    // 快捷键弹窗
    (function showToast() {
        const toast = document.getElementById('shortcutToast');
        toast.classList.add('show');
        setTimeout(() => toast.classList.remove('show'), 3000);
    })();

    // 初始化
    filteredIndices = getData().map((_, i) => i);
    renderCard();
</script>
