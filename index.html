<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>英语单词（高频版）</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            font-family: -apple-system, "PingFang SC", "Helvetica Neue", system-ui, sans-serif;
            background: #f5f5f5;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 16px;
            transition: background 0.3s, color 0.3s;
        }
        .app-container {
            width: 100%;
            max-width: 460px;
            background: #ffffff;
            border-radius: 32px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.04);
            padding: 24px 20px 28px;
            position: relative;
            overflow: hidden;
            transition: background 0.3s, box-shadow 0.3s;
            min-height: 600px;
            display: flex;
            flex-direction: column;
            border: 1px solid #eee;
        }
        /* ===== 水印 ===== */
        .watermark {
            position: absolute;
            top: -10px;
            right: 10px;
            font-family: "STKaiti", "KaiTi", "楷体", serif;
            font-size: 140px;
            font-weight: 900;
            color: #c0c0c0;
            opacity: 0.15;
            pointer-events: none;
            user-select: none;
            z-index: 0;
            line-height: 1;
            transform: rotate(2deg);
            text-shadow: 3px 3px 16px rgba(0,0,0,0.06);
            transition: color 0.3s, opacity 0.3s;
        }
        .footer-saying {
            text-align: center;
            margin-top: 12px;
            font-size: 10px;
            color: #999;
            letter-spacing: 3px;
            font-family: "STKaiti", "KaiTi", "楷体", serif;
            opacity: 0.6;
            user-select: none;
            transition: color 0.3s, opacity 0.3s;
        }
        .header {
            text-align: center;
            margin-bottom: 16px;
            padding-bottom: 12px;
            border-bottom: 1px solid #eee;
            position: relative;
            z-index: 1;
        }
        .header h1 {
            font-size: 20px;
            font-weight: 600;
            color: #1a1a1a;
            letter-spacing: 2px;
            transition: color 0.3s;
        }
        .toolbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
            flex-wrap: wrap;
            gap: 8px;
            position: relative;
            z-index: 1;
        }
        .mode-switch {
            display: flex;
            gap: 4px;
            background: #f0f0f0;
            padding: 3px;
            border-radius: 20px;
        }
        .mode-switch button {
            border: none;
            background: transparent;
            padding: 4px 14px;
            border-radius: 18px;
            font-size: 13px;
            font-weight: 500;
            color: #666;
            cursor: pointer;
            transition: 0.2s;
        }
        .mode-switch button.active {
            background: #222;
            color: #fff;
        }
        .progress-text {
            font-size: 13px;
            color: #888;
            font-weight: 400;
            background: #f0f0f0;
            padding: 4px 14px;
            border-radius: 20px;
        }
        .stats {
            display: flex;
            justify-content: center;
            gap: 16px;
            margin-bottom: 16px;
            font-size: 13px;
            color: #555;
            background: #f8f8f8;
            padding: 6px 0;
            border-radius: 30px;
            position: relative;
            z-index: 1;
        }
        .stats .stat-btn {
            background: none;
            border: none;
            font-size: 13px;
            font-weight: 400;
            color: #222;
            cursor: pointer;
            padding: 2px 8px;
            border-radius: 12px;
            transition: background 0.15s;
        }
        .stats .stat-btn:active {
            background: #e0e0e0;
        }
        .stats .stat-btn .num {
            font-weight: 600;
            color: #000;
        }
        .stats .stat-btn.active-stat {
            background: #ddd;
        }
        .card-wrapper {
            flex: 1;
            perspective: 1200px;
            margin: 4px 0 12px;
            min-height: 280px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            z-index: 1;
        }
        .card {
            width: 100%;
            min-height: 240px;
            background: #ffffff;
            border-radius: 24px;
            box-shadow: 0 4px 16px rgba(0,0,0,0.02);
            padding: 24px 20px;
            cursor: pointer;
            transition: transform 0.35s cubic-bezier(0.23, 1, 0.32, 1), box-shadow 0.3s;
            transform-style: preserve-3d;
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: center;
            border: 1px solid #eee;
        }
        .card.flipped {
            transform: rotateY(180deg);
        }
        .card-front, .card-back {
            backface-visibility: hidden;
            width: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        .card-back {
            transform: rotateY(180deg);
            position: absolute;
            top: 0;
            left: 0;
            padding: 24px 20px;
            height: 100%;
            border-radius: 24px;
            background: #fff;
            border: 1px solid #eee;
        }
        .card-front .word-list {
            font-size: 24px;
            font-weight: 600;
            color: #1a1a1a;
            line-height: 1.6;
            letter-spacing: 1px;
            text-align: center;
        }
        .card-front .word-list span {
            display: inline-block;
            margin: 0 4px;
        }
        .card-front .hint {
            margin-top: 20px;
            font-size: 13px;
            color: #bbb;
            text-align: center;
            letter-spacing: 1px;
            font-weight: 300;
        }
        .card-back .item {
            margin-bottom: 10px;
            border-bottom: 1px solid #f0f0f0;
            padding-bottom: 8px;
        }
        .card-back .item:last-child {
            border-bottom: none;
            margin-bottom: 0;
        }
        .card-back .word {
            font-size: 18px;
            font-weight: 600;
            color: #1a1a1a;
        }
        .card-back .phonetic {
            font-size: 14px;
            color: #888;
            font-weight: 400;
            margin-left: 6px;
        }
        .card-back .meaning {
            font-size: 15px;
            color: #333;
            margin-top: 2px;
            font-weight: 400;
        }
        .card-back .analysis {
            margin-top: 14px;
            padding: 12px 14px;
            background: #f7f7f7;
            border-radius: 12px;
            border-left: 3px solid #888;
            font-size: 14px;
            color: #222;
            line-height: 1.6;
        }
        .card-back .analysis strong {
            font-weight: 600;
            color: #000;
        }
        .actions {
            display: flex;
            justify-content: center;
            align-items: center;
            margin-top: 6px;
            gap: 10px;
            flex-wrap: wrap;
            position: relative;
            z-index: 1;
        }
        .actions button {
            border: 1px solid #ddd;
            background: #f5f5f5;
            color: #222;
            padding: 6px 16px;
            border-radius: 30px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: 0.15s;
            box-shadow: none;
            flex: 0 1 auto;
            min-width: 44px;
            letter-spacing: 0.5px;
        }
        .actions button:active {
            transform: scale(0.96);
            background: #e0e0e0;
        }
        .actions .btn-primary {
            background: #222;
            color: #fff;
            border-color: #222;
        }
        .actions .btn-primary:active {
            background: #444;
        }
        .actions .btn-outline {
            background: transparent;
            border-color: #ccc;
            color: #555;
        }
        .actions .btn-fav {
            background: transparent;
            border-color: #ccc;
            color: #222;
            font-size: 16px;
            padding: 4px 14px;
        }
        .actions .btn-fav.active-fav {
            background: #222;
            color: #fff;
            border-color: #222;
        }
        /* ===== 黑白切换按钮（圆形，与翻转底色同步） ===== */
        .btn-dark-toggle {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            border: 1px solid #222;
            background: #222;
            color: #fff;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: 0.15s;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0;
            flex-shrink: 0;
        }
        .btn-dark-toggle:active {
            transform: scale(0.96);
        }
        .game-area {
            display: none;
            margin-top: 16px;
            padding: 16px;
            background: #fafafa;
            border-radius: 20px;
            border: 1px solid #ddd;
            flex-direction: column;
            gap: 12px;
            position: relative;
            z-index: 1;
        }
        .game-area.active {
            display: flex;
        }
        .game-area .game-title {
            font-size: 15px;
            font-weight: 600;
            color: #222;
            text-align: center;
        }
        .game-area .drop-zone {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
            min-height: 56px;
            padding: 12px;
            background: #fff;
            border-radius: 16px;
            border: 1px dashed #bbb;
            transition: 0.2s;
        }
        .game-area .token {
            background: #222;
            color: #fff;
            padding: 6px 16px;
            border-radius: 30px;
            font-size: 14px;
            font-weight: 500;
            cursor: grab;
            user-select: none;
            transition: 0.15s;
        }
        .game-area .token:active {
            cursor: grabbing;
            transform: scale(0.95);
        }
        .game-area .token.placed {
            background: #555;
            cursor: default;
        }
        .game-area .token.wrong {
            background: #000;
            animation: shake 0.3s;
            border: 1px solid #999;
        }
        .game-area .game-actions {
            display: flex;
            gap: 10px;
            justify-content: center;
        }
        .game-area .game-actions button {
            padding: 8px 20px;
            border: 1px solid #ddd;
            border-radius: 30px;
            font-weight: 500;
            font-size: 13px;
            background: #f5f5f5;
            color: #222;
            cursor: pointer;
        }
        .game-area .game-actions .btn-reset {
            background: transparent;
            border-color: #ccc;
        }
        @keyframes shake {
            0%,100%{ transform: translateX(0); }
            25%{ transform: translateX(-6px); }
            75%{ transform: translateX(6px); }
        }
        /* ===== 暗色/黑白模式 ===== */
        body.dark-mode {
            background: #1a1a1a;
        }
        body.dark-mode .app-container {
            background: #1e1e1e;
            border-color: #333;
            box-shadow: none;
        }
        body.dark-mode .header h1 { color: #ddd; }
        body.dark-mode .header { border-bottom-color: #333; }
        body.dark-mode .card { background: #252525; border-color: #333; }
        body.dark-mode .card-back { background: #252525; border-color: #333; }
        body.dark-mode .card-front .word-list { color: #ddd; }
        body.dark-mode .card-front .hint { color: #666; }
        body.dark-mode .card-back .word { color: #eee; }
        body.dark-mode .card-back .meaning { color: #bbb; }
        body.dark-mode .card-back .analysis { background: #1e1e1e; color: #ccc; border-left-color: #888; }
        body.dark-mode .card-back .analysis strong { color: #fff; }
        body.dark-mode .stats { background: #252525; color: #999; }
        body.dark-mode .stats .stat-btn { color: #ccc; }
        body.dark-mode .stats .stat-btn .num { color: #fff; }
        body.dark-mode .stats .stat-btn:active { background: #3a3a3a; }
        body.dark-mode .mode-switch { background: #2a2a2a; }
        body.dark-mode .mode-switch button { color: #888; }
        body.dark-mode .mode-switch button.active { background: #eee; color: #222; }
        body.dark-mode .actions button { background: #2a2a2a; color: #ccc; border-color: #444; }
        body.dark-mode .actions .btn-primary { background: #eee; color: #222; border-color: #eee; }
        body.dark-mode .actions .btn-outline { background: transparent; border-color: #444; color: #aaa; }
        body.dark-mode .actions .btn-fav {
            background: transparent;
            border-color: #444;
            color: #fff !important;
        }
        body.dark-mode .actions .btn-fav.active-fav {
            background: #eee;
            color: #222 !important;
            border-color: #eee;
        }
        /* 暗色下黑白切换按钮：白底黑字（与翻转按钮底色同步） */
        body.dark-mode .btn-dark-toggle {
            background: #eee;
            color: #222;
            border-color: #eee;
        }
        body.dark-mode .game-area { background: #1e1e1e; border-color: #333; }
        body.dark-mode .game-area .game-title { color: #ccc; }
        body.dark-mode .game-area .drop-zone { background: #252525; border-color: #444; }
        body.dark-mode .game-area .token { background: #eee; color: #222; }
        body.dark-mode .game-area .token.placed { background: #888; color: #fff; }
        body.dark-mode .game-area .game-actions button { background: #2a2a2a; color: #ccc; border-color: #444; }
        body.dark-mode .progress-text { background: #2a2a2a; color: #aaa; }
        body.dark-mode .watermark { color: #ffffff; opacity: 0.12; }
        body.dark-mode .footer-saying { color: #888; opacity: 0.5; }
        ::-webkit-scrollbar { width: 3px; }
        ::-webkit-scrollbar-track { background: #f0f0f0; }
        ::-webkit-scrollbar-thumb { background: #ccc; border-radius: 10px; }
    </style>
</head>
<body>

<div class="app-container" id="app">
    <div class="watermark">笃</div>
    <div class="header">
        <h1>形近词 · 高频100组</h1>
    </div>
    <div class="toolbar">
        <div class="mode-switch" id="modeSwitch">
            <button class="active" data-mode="flip">翻转</button>
            <button data-mode="browse">浏览</button>
        </div>
        <span class="progress-text" id="progressText">1 / 100</span>
    </div>
    <div class="stats" id="statsBar">
        <button class="stat-btn" data-filter="learned">已学 <span class="num" id="learnedCount">0</span></button>
        <button class="stat-btn" data-filter="fav">★ 收藏 <span class="num" id="favCount">0</span></button>
        <button class="stat-btn" data-filter="wrong">错题 <span class="num" id="wrongCount">0</span></button>
        <button class="stat-btn" data-filter="all" id="showAllBtn" style="display:none;">全部</button>
    </div>
    <div class="card-wrapper">
        <div class="card" id="card">
            <div class="card-front" id="cardFront">
                <div class="word-list" id="wordList"></div>
                <div class="hint">点击翻转</div>
            </div>
            <div class="card-back" id="cardBack">
                <div id="backContent"></div>
            </div>
        </div>
    </div>
    <div class="actions">
        <button class="btn-outline" id="prevBtn">◀</button>
        <button class="btn-primary" id="flipBtn">翻转</button>
        <button class="btn-outline" id="nextBtn">▶</button>
    </div>
    <div class="actions">
        <button class="btn-fav" id="favBtn">☆</button>
        <button class="btn-outline" id="wrongBtn">错题</button>
    </div>
    <div class="actions">
        <button class="btn-outline" id="gameUnlockBtn">游戏</button>
        <button class="btn-outline" id="resetProgressBtn">重置进度</button>
        <button class="btn-dark-toggle" id="styleToggle">☯</button>
    </div>
    <div class="footer-saying">事以密成 · 一鸣惊人</div>
    <div class="game-area" id="gameArea">
        <div class="game-title">打散排序 · 拖拽复原</div>
        <div class="drop-zone" id="dropZone"></div>
        <div class="game-actions">
            <button class="btn-reset" id="gameReset">重排</button>
            <button id="gameCheck">检查</button>
        </div>
    </div>
</div>

<script>
// ============================================================
// 数据区：100组形近词（完整版）
// ============================================================
const CARD_DATA = [
  { id:1, group: ["adapt","adopt","adept"], meanings: ["/əˈdæpt/ 适应；改编","/əˈdɒpt/ 采纳；收养","/əˈdept/ 熟练的，内行的"], analysis: "拼写差异在第二个字母a/o/e；完形高频，adapt强调“调整以适应”，adopt强调“采纳/收养”，adept为形容词“熟练的”。" },
  { id:2, group: ["affect","effect"], meanings: ["/əˈfekt/ 影响；假装","/ɪˈfekt/ 效果，结果；引起，实现"], analysis: "拼写差异在开头字母a/e；完形高频，affect为动词（影响），effect多为名词（效果），作动词时意为“引起”。" },
  { id:3, group: ["rise","raise","arise","arouse"], meanings: ["/raɪz/ 上升；起床；增长","/reɪz/ 举起；提高；养育","/əˈraɪz/ 出现；产生；起身","/əˈraʊz/ 激起；唤醒"], analysis: "拼写差异在首字母和结尾；完形高频，rise不及物，raise及物，arise指“出现”，arouse指“激起”。" },
  { id:4, group: ["considerable","considerate"], meanings: ["/kənˈsɪdərəbl/ 相当大的；重要的","/kənˈsɪdərət/ 体贴的；考虑周到的"], analysis: "拼写差异在结尾-able/-ate；完形高频，considerable指“数量/程度大”，considerate指“为人体贴”。" },
  { id:5, group: ["economic","economical"], meanings: ["/ˌiːkəˈnɒmɪk/ 经济的；经济学的","/ˌiːkəˈnɒmɪkl/ 节约的；经济的"], analysis: "拼写差异在结尾-ic/-ical；阅读高频，economic指“与经济有关的”，economical指“节省的”。" },
  { id:6, group: ["principal","principle"], meanings: ["/ˈprɪnsəpl/ 主要的；校长；本金","/ˈprɪnsəpl/ 原则；原理；准则"], analysis: "拼写差异在结尾-al/-le（发音相同）；完形高频，principal为形容词或名词（校长/本金），principle为名词（原则）。" },
  { id:7, group: ["confirm","conform"], meanings: ["/kənˈfɜːm/ 确认；证实；批准","/kənˈfɔːm/ 遵守；符合；一致"], analysis: "拼写差异在第二音节元音ir/or；完形高频，confirm指“证实”，conform指“遵从/符合”。" },
  { id:8, group: ["intense","intensive"], meanings: ["/ɪnˈtens/ 强烈的；紧张的；激烈的","/ɪnˈtensɪv/ 密集的；加强的；集约的"], analysis: "拼写差异在结尾-se/-sive；阅读高频，intense强调程度深，intensive强调密度/强度集中。" },
  { id:9, group: ["invent","invest"], meanings: ["/ɪnˈvent/ 发明；捏造","/ɪnˈvest/ 投资；投入"], analysis: "拼写差异在第三个字母e/s；完形高频，invent指“创造新事物”，invest指“投入资金/精力”。" },
  { id:10, group: ["extend","extent"], meanings: ["/ɪkˈstend/ 延伸；扩展；给予","/ɪkˈstent/ 程度；范围"], analysis: "拼写差异在结尾-d/-t；阅读高频，extend为动词（延伸），extent为名词（程度）。" },
  { id:11, group: ["emerge","immerge"], meanings: ["/ɪˈmɜːdʒ/ 出现；浮现","/ɪˈmɜːdʒ/ 浸入；没入"], analysis: "拼写差异在开头字母e/i；阅读高频，emerge指“出来/出现”，immerge指“进去/浸入”。" },
  { id:12, group: ["exhaust","exhibit"], meanings: ["/ɪɡˈzɔːst/ 耗尽；使精疲力尽；排气","/ɪɡˈzɪbɪt/ 展览；展示；表现"], analysis: "拼写差异在第二音节-au/-ib；阅读高频，exhaust指“耗尽资源/精力”，exhibit指“展出/显示”。" },
  { id:13, group: ["exploit","explore"], meanings: ["/ɪkˈsplɔɪt/ 利用；开发；剥削","/ɪkˈsplɔː/ 探索；探测；考察"], analysis: "拼写差异在结尾-it/-ore；阅读高频，exploit指“开发利用/剥削”，explore指“探索未知”。" },
  { id:14, group: ["supplement","suppress"], meanings: ["/ˈsʌplɪmənt/ 补充；增补","/səˈpres/ 镇压；抑制；阻止"], analysis: "拼写差异在第三音节-le/-re；阅读高频，supplement指“增加补充”，suppress指“压制/制止”。" },
  { id:15, group: ["assignment","assessment"], meanings: ["/əˈsaɪnmənt/ 任务；分配；作业","/əˈsesmənt/ 评估；评价"], analysis: "拼写差异在第二音节-gn/-ss；阅读高频，assignment指“分配的任务”，assessment指“对价值的评价”。" },
  { id:16, group: ["perceive","conceive","deceive"], meanings: ["/pəˈsiːv/ 感知；察觉；理解","/kənˈsiːv/ 设想；怀有（想法）；怀孕","/dɪˈsiːv/ 欺骗；蒙蔽"], analysis: "拼写差异在前缀per-/con-/de-；完形高频，词根相同但前缀不同导致含义差异。" },

// ============================================================
// 核心逻辑
// ============================================================
let currentIndex = 0;
let currentMode = 'flip';
let isFlipped = false;
let learnedSet = new Set(JSON.parse(localStorage.getItem('learnedSet_v2') || '[]'));
let favSet = new Set(JSON.parse(localStorage.getItem('favSet_v2') || '[]'));
let wrongSet = new Set(JSON.parse(localStorage.getItem('wrongSet_v2') || '[]'));
let gameUnlocked = parseInt(localStorage.getItem('gameUnlocked_v2') || '0');
let currentFilter = 'all';
let filteredIndices = [];

const cardEl = document.getElementById('card');
const wordListEl = document.getElementById('wordList');
const backContentEl = document.getElementById('backContent');
const progressText = document.getElementById('progressText');
const learnedCountEl = document.getElementById('learnedCount');
const favCountEl = document.getElementById('favCount');
const wrongCountEl = document.getElementById('wrongCount');
const gameArea = document.getElementById('gameArea');
const dropZone = document.getElementById('dropZone');
const gameUnlockBtn = document.getElementById('gameUnlockBtn');
const favBtn = document.getElementById('favBtn');
const showAllBtn = document.getElementById('showAllBtn');

function getCurrentCard() {
    return CARD_DATA[currentIndex];
}

function renderCard() {
    const card = getCurrentCard();
    wordListEl.innerHTML = card.group.map(w => `<span>${w}</span>`).join('');
    let html = '';
    card.group.forEach((w, i) => {
        html += `<div class="item"><span class="word">${w}</span><span class="phonetic">${card.meanings[i]}</span></div>`;
    });
    html += `<div class="analysis"><strong>辨析：</strong>${card.analysis}</div>`;
    backContentEl.innerHTML = html;

    if (currentMode === 'browse') {
        cardEl.classList.add('flipped');
        isFlipped = true;
    } else {
        cardEl.classList.remove('flipped');
        isFlipped = false;
    }
    updateProgress();
    updateStats();
    checkGameUnlock();
    updateFavButton();
}

function updateProgress() {
    const total = currentFilter === 'all' ? CARD_DATA.length : filteredIndices.length;
    const idx = currentFilter === 'all' ? currentIndex : filteredIndices.indexOf(currentIndex);
    progressText.textContent = `${idx + 1} / ${total}`;
}

function updateStats() {
    learnedCountEl.textContent = learnedSet.size;
    favCountEl.textContent = favSet.size;
    wrongCountEl.textContent = wrongSet.size;
    localStorage.setItem('learnedSet_v2', JSON.stringify([...learnedSet]));
    localStorage.setItem('favSet_v2', JSON.stringify([...favSet]));
    localStorage.setItem('wrongSet_v2', JSON.stringify([...wrongSet]));
}

function updateFavButton() {
    if (favSet.has(currentIndex)) {
        favBtn.textContent = '★';
        favBtn.style.background = '#222';
        favBtn.style.color = '#fff';
        favBtn.style.borderColor = '#222';
    } else {
        favBtn.textContent = '☆';
        favBtn.style.background = 'transparent';
        favBtn.style.color = '#222';
        favBtn.style.borderColor = '#ccc';
    }
}

function checkGameUnlock() {
    if (learnedSet.size >= 10) {
        localStorage.setItem('gameUnlocked_v2', '1');
        gameUnlocked = 1;
        gameUnlockBtn.textContent = '游戏';
        gameUnlockBtn.style.opacity = '1';
    } else {
        gameUnlockBtn.textContent = '游戏';
        gameUnlockBtn.style.opacity = '0.5';
    }
}

function getFilteredList() {
    if (currentFilter === 'learned') return [...learnedSet];
    if (currentFilter === 'fav') return [...favSet];
    if (currentFilter === 'wrong') return [...wrongSet];
    return CARD_DATA.map((_, i) => i);
}

function applyFilter(filter) {
    currentFilter = filter;
    filteredIndices = getFilteredList();
    if (filteredIndices.length === 0) {
        alert('当前筛选下没有卡片。');
        currentFilter = 'all';
        filteredIndices = CARD_DATA.map((_, i) => i);
    }
    currentIndex = filteredIndices[0];
    renderCard();
    document.querySelectorAll('.stat-btn').forEach(btn => {
        btn.classList.remove('active-stat');
        if (btn.dataset.filter === filter) btn.classList.add('active-stat');
    });
    if (filter === 'all') showAllBtn.style.display = 'none';
    else showAllBtn.style.display = 'inline-block';
}

function goTo(index) {
    const list = currentFilter === 'all' ? CARD_DATA.map((_, i) => i) : filteredIndices;
    let pos = list.indexOf(index);
    if (pos === -1) {
        index = list[0] || 0;
    }
    if (index < 0) index = list[list.length - 1] || 0;
    if (index >= CARD_DATA.length) index = 0;
    currentIndex = index;
    renderCard();
}

function nextCard() {
    const list = currentFilter === 'all' ? CARD_DATA.map((_, i) => i) : filteredIndices;
    let pos = list.indexOf(currentIndex);
    if (pos === -1) pos = 0;
    pos = (pos + 1) % list.length;
    currentIndex = list[pos];
    renderCard();
}

function prevCard() {
    const list = currentFilter === 'all' ? CARD_DATA.map((_, i) => i) : filteredIndices;
    let pos = list.indexOf(currentIndex);
    if (pos === -1) pos = 0;
    pos = (pos - 1 + list.length) % list.length;
    currentIndex = list[pos];
    renderCard();
}

function toggleFlip() {
    if (currentMode === 'browse') return;
    cardEl.classList.toggle('flipped');
    isFlipped = !isFlipped;
    if (isFlipped) {
        learnedSet.add(currentIndex);
        updateStats();
        checkGameUnlock();
    }
}

function toggleFav() {
    if (favSet.has(currentIndex)) favSet.delete(currentIndex);
    else favSet.add(currentIndex);
    updateStats();
    updateFavButton();
}

function markWrong() {
    wrongSet.add(currentIndex);
    updateStats();
    nextCard();
}

function resetProgress() {
    if (confirm('确定重置所有学习进度吗？（收藏和错题不受影响）')) {
        learnedSet.clear();
        localStorage.setItem('learnedSet_v2', JSON.stringify([]));
        updateStats();
        checkGameUnlock();
    }
}

// 游戏逻辑
let gameTokens = [];
let gameCardIndex = -1;

function startGame() {
    if (gameUnlocked === 0) {
        alert('游戏需要先学完10组才能解锁。');
        return;
    }
    let idx = currentIndex;
    if (!learnedSet.has(idx)) {
        const learnedArr = [...learnedSet];
        if (learnedArr.length === 0) { alert('请先学一些卡片再玩游戏！'); return; }
        idx = learnedArr[Math.floor(Math.random() * learnedArr.length)];
    }
    gameCardIndex = idx;
    const card = CARD_DATA[idx];
    const tokens = [...card.group];
    for (let i = tokens.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [tokens[i], tokens[j]] = [tokens[j], tokens[i]];
    }
    gameTokens = tokens;
    renderGame();
    gameArea.classList.add('active');
}

function renderGame() {
    dropZone.innerHTML = '';
    gameTokens.forEach((token, i) => {
        const el = document.createElement('div');
        el.className = 'token';
        el.textContent = token;
        el.draggable = true;
        el.dataset.index = i;
        el.addEventListener('dragstart', (e) => {
            e.dataTransfer.setData('text/plain', i);
        });
        dropZone.appendChild(el);
    });
    dropZone.addEventListener('dragover', (e) => e.preventDefault());
    dropZone.addEventListener('drop', (e) => {
        e.preventDefault();
        const fromIdx = parseInt(e.dataTransfer.getData('text/plain'));
        const targetEl = e.target.closest('.token');
        if (!targetEl) return;
        const toIdx = parseInt(targetEl.dataset.index);
        if (fromIdx === toIdx) return;
        [gameTokens[fromIdx], gameTokens[toIdx]] = [gameTokens[toIdx], gameTokens[fromIdx]];
        renderGame();
    });
    dropZone.querySelectorAll('.token').forEach(el => {
        el.addEventListener('click', () => {
            const idx = parseInt(el.dataset.index);
            if (idx === 0) return;
            [gameTokens[0], gameTokens[idx]] = [gameTokens[idx], gameTokens[0]];
            renderGame();
        });
    });
}

function checkGame() {
    if (gameCardIndex === -1) return;
    const card = CARD_DATA[gameCardIndex];
    const correct = card.group;
    let allCorrect = true;
    const tokens = dropZone.querySelectorAll('.token');
    tokens.forEach((el, i) => {
        el.classList.remove('wrong', 'placed');
        if (el.textContent === correct[i]) {
            el.classList.add('placed');
        } else {
            el.classList.add('wrong');
            allCorrect = false;
        }
    });
    if (allCorrect) {
        alert('完全正确！');
    } else {
        alert('顺序不对，红色标记为错误位置。');
    }
}

function resetGame() {
    if (gameCardIndex === -1) return;
    const card = CARD_DATA[gameCardIndex];
    const tokens = [...card.group];
    for (let i = tokens.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [tokens[i], tokens[j]] = [tokens[j], tokens[i]];
    }
    gameTokens = tokens;
    renderGame();
}

// 事件绑定
document.getElementById('nextBtn').addEventListener('click', nextCard);
document.getElementById('prevBtn').addEventListener('click', prevCard);
document.getElementById('flipBtn').addEventListener('click', toggleFlip);
document.getElementById('card').addEventListener('click', toggleFlip);
favBtn.addEventListener('click', toggleFav);
document.getElementById('wrongBtn').addEventListener('click', markWrong);
document.getElementById('resetProgressBtn').addEventListener('click', resetProgress);
gameUnlockBtn.addEventListener('click', startGame);
document.getElementById('gameReset').addEventListener('click', resetGame);
document.getElementById('gameCheck').addEventListener('click', checkGame);

document.querySelectorAll('.stat-btn').forEach(btn => {
    btn.addEventListener('click', function() {
        const filter = this.dataset.filter;
        if (filter === 'all') {
            currentFilter = 'all';
            filteredIndices = CARD_DATA.map((_, i) => i);
            currentIndex = filteredIndices[0];
            renderCard();
            document.querySelectorAll('.stat-btn').forEach(b => b.classList.remove('active-stat'));
            showAllBtn.style.display = 'none';
            return;
        }
        applyFilter(filter);
    });
});

showAllBtn.addEventListener('click', function() {
    currentFilter = 'all';
    filteredIndices = CARD_DATA.map((_, i) => i);
    currentIndex = filteredIndices[0];
    renderCard();
    document.querySelectorAll('.stat-btn').forEach(b => b.classList.remove('active-stat'));
    showAllBtn.style.display = 'none';
});

document.querySelectorAll('#modeSwitch button').forEach(btn => {
    btn.addEventListener('click', function() {
        document.querySelectorAll('#modeSwitch button').forEach(b => b.classList.remove('active'));
        this.classList.add('active');
        currentMode = this.dataset.mode;
        renderCard();
    });
});

document.getElementById('styleToggle').addEventListener('click', function() {
    document.body.classList.toggle('dark-mode');
});

document.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowRight') nextCard();
    if (e.key === 'ArrowLeft') prevCard();
    if (e.key === ' ') { e.preventDefault(); toggleFlip(); }
});

filteredIndices = CARD_DATA.map((_, i) => i);
renderCard();
</script>
